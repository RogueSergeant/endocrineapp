name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Website (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Also downloads and hash-checks the OCR models (prebuild step).
      - run: npm run build
      - name: Validate Cloudflare config
        run: npx wrangler deploy --dry-run

  data-pipeline:
    name: Data pipeline (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: data-pipeline/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes a check that the committed spreadsheets and snapshot
      # reproduce the data bundled with the website.
      - run: npm test
